[tool.ruff]
target-version = "py312"
line-length = 80

[tool.ruff.lint]
# Select basic syntax/bug checks (E, F, W) # and type annotations hints (ANN)
select = ["E", "F", "W"]

# Ignore rules that force students into documentation rabbit holes
ignore = [
    "DTZ",    # Naive datetime warnings (e.g., date.today())
#    "E501",   # Line length limits
]
